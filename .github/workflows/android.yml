name: Android checks and release APKs

# One pipeline, three duties:
#   1. every push / pull request  -> static analysis, all offline tests, both APKs
#   2. every push / tag           -> the two APKs and SHA256SUMS.txt as artifacts
#   3. a `v*` tag                 -> the same two files as a published release
#
# The release files are built here and nowhere else, so both architectures come
# from one tree, one Flutter version and one signing key. The key lives in the
# `IRONPIN_*` secrets; without them Gradle silently falls back to the debug key
# (android/app/build.gradle) and a warning is printed instead of a failure.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --concurrency=1

      - name: Read the version from pubspec.yaml
        run: |
          version=$(sed -nE 's/^version: *([0-9.]+).*/\1/p' pubspec.yaml)
          test -n "$version"
          echo "IRONPIN_VERSION=$version" >> "$GITHUB_ENV"
          # Persian digits for the release title and the notes.
          python3 - "$version" <<'PY' >> "$GITHUB_ENV"
          import sys
          fa = str.maketrans("0123456789", "۰۱۲۳۴۵۶۷۸۹")
          print("IRONPIN_VERSION_FA=" + sys.argv[1].translate(fa))
          PY
          mkdir -p apk-out

      # The same key on every run, so a new APK installs over the previous one
      # and the local archive survives the upgrade. Base64 keeps the binary
      # store intact through the secret store.
      - name: Prepare the signing key
        env:
          KEYSTORE_B64: ${{ secrets.IRONPIN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.IRONPIN_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.IRONPIN_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IRONPIN_KEY_ALIAS }}
        run: |
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::warning::no IRONPIN_KEYSTORE_BASE64 secret: Gradle signs with the debug key"
            exit 0
          fi
          keystore="$RUNNER_TEMP/ironpin-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          {
            echo "IRONPIN_KEYSTORE=$keystore"
            echo "IRONPIN_STORE_PASSWORD=$STORE_PASSWORD"
            echo "IRONPIN_KEY_ALIAS=$KEY_ALIAS"
            echo "IRONPIN_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # One architecture per build, two builds.
      #
      # android/app/build.gradle sets ndk.abiFilters from the -Ptarget-platform
      # that Flutter passes, so that the OCR library cannot put its other-ABI
      # copies into the package. `--split-per-abi` asks Gradle for ABI splits as
      # well, and Gradle refuses the two together ("ndk abiFilters cannot be
      # present when splits abi filters are set"). This is the same pair of
      # commands docs/BUILD.fa.md gives for a build by hand.
      - name: Build the 32-bit APK (armeabi-v7a)
        run: |
          flutter build apk --release --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-release.apk \
             "apk-out/IronPin-${IRONPIN_VERSION}-armeabi-v7a-release.apk"

      - name: Build the 64-bit APK (arm64-v8a)
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk \
             "apk-out/IronPin-${IRONPIN_VERSION}-arm64-v8a-release.apk"

      # A package that carries libraries of the other architecture, lacks the
      # OCR library or its language data, or is not signed, must fail here and
      # not on a phone.
      - name: Check what each APK contains
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools=$(ls -d "$sdk"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$build_tools" ] || [ ! -x "$build_tools/aapt2" ]; then
            echo "::error::no aapt2 under $sdk/build-tools"
            exit 1
          fi
          check() {
            apk="apk-out/IronPin-${IRONPIN_VERSION}-$1-release.apk"
            unzip -Z1 "$apk" > listing.txt
            if grep '^lib/' listing.txt | grep -v "^lib/$1/"; then
              echo "::error::$apk holds libraries of another architecture"
              exit 1
            fi
            for needed in "lib/$1/libapp.so" "lib/$1/libflutter.so" \
                "lib/$1/libtesseract.so" "assets/tessdata/fas.traineddata" \
                "assets/tessdata/eng.traineddata"; do
              grep -qx "$needed" listing.txt || {
                echo "::error::$apk lacks $needed"
                exit 1
              }
            done
            badging=$("$build_tools/aapt2" dump badging "$apk")
            echo "$badging" | grep -q "versionName='${IRONPIN_VERSION}'" || {
              echo "::error::$apk has the wrong versionName"; exit 1; }
            echo "$badging" | grep -q "native-code: '$1'" || {
              echo "::error::$apk does not declare $1"; exit 1; }
            # apksigner writes the certificate block to stderr, so both
            # streams are captured; the digest below is read from this file.
            "$build_tools/apksigner" verify --print-certs "$apk" 2>&1 \
              | tee "apk-out/$1-certs.txt"
            echo "$apk: only $1, OCR library and language data present"
          }
          check armeabi-v7a
          check arm64-v8a
          (cd apk-out && sha256sum *.apk | tee SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: IronPin-${{ env.IRONPIN_VERSION }}-release-APKs
          path: |
            apk-out/*.apk
            apk-out/SHA256SUMS.txt
          if-no-files-found: error

      # The release notes carry the measured facts of this very run: sizes,
      # hashes and the signing certificate, all read from the files above.
      - name: Prepare the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cert=$(grep -m1 -i 'certificate SHA-256 digest' apk-out/armeabi-v7a-certs.txt \
                 | sed 's/.*digest: *//' | tr -d ' ')
          if [ -z "$cert" ]; then
            echo "::error::the signing certificate digest was not captured"
            exit 1
          fi
          sums=$(sed 's/^/`/; s/  /`  \`/; s/$/`/' apk-out/SHA256SUMS.txt)
          {
            echo "## آیرون‌پین ${IRONPIN_VERSION_FA} — هر دو معماری"
            echo
            echo "| فایل | معماری | برای | حجم |"
            echo "| --- | --- | --- | ---: |"
            echo "| \`IronPin-${IRONPIN_VERSION}-armeabi-v7a-release.apk\` | ۳۲ بیتی | گوشی‌های قدیمی‌تر و ارزان‌تر | $(stat -c%s apk-out/IronPin-${IRONPIN_VERSION}-armeabi-v7a-release.apk) بایت |"
            echo "| \`IronPin-${IRONPIN_VERSION}-arm64-v8a-release.apk\` | ۶۴ بیتی | بیشتر گوشی‌های امروز | $(stat -c%s apk-out/IronPin-${IRONPIN_VERSION}-arm64-v8a-release.apk) بایت |"
            echo
            echo "هر دو فایل از یک درخت، یک نسخهٔ Flutter و یک کلید امضا ساخته شده‌اند."
            echo
            echo "هش SHA-256:"
            echo
            echo "$sums"
            echo
            echo "### نصب"
            echo
            echo "۱. پیش از هر تغییری از داخل برنامه «پشتیبان کامل» بگیرید."
            echo "۲. اگر نسخهٔ نصب‌شده با کلید دیگری امضا شده، اندروید نصب روی آن را رد می‌کند؛"
            echo "   در آن صورت نسخهٔ قبلی را حذف کنید و بعد این فایل را نصب کنید."
            echo "۳. بعد از نصب، همان فایل پشتیبان را بازیابی کنید."
            echo
            echo "### امضا"
            echo
            echo "گواهی SHA-256: \`${cert}\`"
            echo
            echo "فقط کتابخانهٔ معماری خودِ هر فایل در آن است و مدل‌های آفلاین OCR فارسی و انگلیسی"
            echo "همراهش هست؛ هیچ کتابخانهٔ ۶۴بیتی در فایل ۳۲بیتی نیست."
          } > release-notes.md
          cat release-notes.md

      - name: Publish both architectures on the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: آیرون‌پین ${{ env.IRONPIN_VERSION_FA }} — ARMv7 و ARM64
          body_path: release-notes.md
          files: |
            apk-out/*.apk
            apk-out/SHA256SUMS.txt
          fail_on_unmatched_files: true

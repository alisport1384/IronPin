name: Android checks and test APKs
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --concurrency=1
      - name: Build both ARM test release APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: IronPin-test-release-APKs
          path: build/app/outputs/flutter-apk/*-release.apk

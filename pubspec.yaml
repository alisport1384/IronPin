name: ironpin
description: Persian iron market monitor with on-device source refresh and history.
publish_to: none
version: 0.9.5+27
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  html: 0.15.4
  http: 1.2.2
  sqflite: 2.3.3+1
  path: 1.9.0
  url_launcher: 6.3.0
  shamsi_date: 1.0.4
  workmanager: 0.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  sqflite_common_ffi: 2.3.3
flutter:
  uses-material-design: true
  assets:
    - assets/registry.json
    - assets/cities.json
    - assets/calculation_sources.json
    - assets/THIRD_PARTY_NOTICES.txt
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/Vazirmatn-Regular.ttf
        - asset: assets/Vazirmatn-Bold.ttf
          weight: 700

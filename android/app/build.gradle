plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "ir.ironpin.ironpin"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    // A stable key keeps a new build installable over the previous one, so the
    // local archive is never lost to an uninstall. Supplied through the
    // environment (see tool/sign_env.sh); without it the debug key is used, as
    // before, and nothing machine-specific is stored in the source.
    def releaseStore = System.getenv('IRONPIN_KEYSTORE')
    signingConfigs {
        if (releaseStore != null) {
            release {
                storeFile file(releaseStore)
                storePassword System.getenv('IRONPIN_STORE_PASSWORD')
                keyAlias System.getenv('IRONPIN_KEY_ALIAS')
                keyPassword System.getenv('IRONPIN_KEY_PASSWORD')
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "ir.ironpin.ironpin"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 21
        targetSdk = 35
        // The delivered APK is 32-bit only, as requested. Without this filter the
        // OCR library would drag its arm64/x86 copies into the same APK and leave
        // a mixed-ABI package that cannot load on 64-bit phones.
        ndk {
            abiFilters 'armeabi-v7a'
        }
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = releaseStore != null
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

dependencies {
    // Offline Persian OCR. ML Kit's on-device text recognition has no Persian
    // model, so Tesseract 5 with the `fas` trained data reads the picture on the
    // phone itself (see OcrChannel.kt and android/app/src/main/assets/tessdata).
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.8.0'
}

flutter {
    source = "../.."
}
